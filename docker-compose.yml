version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=1234
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-ui
    environment:
      - PMA_HOST=mysql # ชี้ไปที่ชื่อ service ของฐานข้อมูลด้านบน
      - PMA_USER=root
      - PMA_PASSWORD=1234
    ports:
      # เข้าใช้งานผ่านบราวเซอร์ที่ localhost:8080
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data: